[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliomancer"
description = "BiblioMancer: a local, automated knowledge base of scientific papers (LM Studio)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matteo Marchionni" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "pypdfium2>=4.30",
    "requests>=2.28",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]
build = ["pyinstaller>=6.5"]

[project.scripts]
bibliomancer = "bibliomancer.cli:main"

[project.gui-scripts]
bibliomancer-gui = "bibliomancer.gui:main"

[tool.setuptools.dynamic]
version = { attr = "bibliomancer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bibliomancer = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
